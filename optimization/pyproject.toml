[project]
name = "sih-block-planner"
version = "0.1.0"
description = "AI-powered automated block planning system for Indian Railways"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.8",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
